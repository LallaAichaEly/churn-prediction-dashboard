# Module 6 — Intégration continue : les tests tournent à chaque push et pull request.
# Un test cassé = une croix rouge sur GitHub, avant que le problème n'arrive en production.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Entraînement de bout en bout
        run: python scripts/train.py
