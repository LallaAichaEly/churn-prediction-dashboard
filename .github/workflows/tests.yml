# Module 6.3 — Intégration continue : les tests tournent à chaque push et pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests (données, modèles, API, tableau de bord, corrigés)
        run: pytest -q
      - name: Entraînement de bout en bout
        run: python scripts/train.py
